{% extends 'base.html' %}

{% block title %} Connexion | Plateforme Gouvernementale {% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-4">
        
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
            <div class="card-body p-4 p-md-5">
                
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-circle d-inline-block mb-3">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h2 class="fw-bold h4 mb-1">Espace Connexion</h2>
                    <p class="text-muted small">Accédez à vos outils et données sécurisées</p>
                </div>

                <form method="post" class="custom-django-form">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        {{ form.as_p }}
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm rounded-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                    </button>
                </form>
                
                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">Vous n'avez pas de compte ? 
                        <a href="{% url 'signup' %}" class="text-primary fw-semibold text-decoration-none ms-1">
                            Créer un compte <i class="bi bi-arrow-right small"></i>
                        </a>
                    </p>
                </div>

            </div>
        </div>

    </div>
</div>

<style>
    /* Espacement vertical des lignes générées par Django */
    .custom-django-form p {
        margin-bottom: 1.25rem;
    }
    
    /* Style des étiquettes (Identifiant / Mot de passe) */
    .custom-django-form label {
        display: block;
        margin-bottom: 0.4rem;
        font-weight: 500;
        color: #343a40;
        font-size: 0.88rem;
    }
    
    /* Embellissement des champs de saisie (inputs) */
    .custom-django-form input[type="text"],
    .custom-django-form input[type="password"],
    .custom-django-form input[type="email"] {
        display: block;
        width: 100%;
        padding: 0.55rem 0.75rem;
        font-size: 0.95rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }
    
    /* Effet d'illumination bleue au clic sur un champ */
    .custom-django-form input:focus {
        color: #212529;
        background-color: #fff;
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
    }
    
    /* Gestion élégante des listes d'erreurs d'authentification (ex: mauvais mot de passe) */
    .custom-django-form .errorlist {
        list-style: none;
        padding-left: 0;
        color: #dc3545;
        font-size: 0.82rem;
        margin-bottom: 0.75rem;
        font-weight: 500;
    }
    .custom-django-form .errorlist li::before {
        content: "⚠️ ";
    }
</style>
{% endblock %}
