{% extends 'base.html' %}

{% block title %}Reset Your Password{% endblock %}

{% block content %}
<h2>Reset Your Password</h2>
<p>Please enter your new password below. Make sure to choose a strong password that you haven't used
before.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Reset Password</button>
</form>
{% endblock %}
