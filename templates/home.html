{% extends 'base.html' %}

{% block title%} Home {% endblock %}

{% block content %}

{% if user.is_authenticated %}
    Hi {{user.username}}!
    <form action="/users/logout/" method="post" class="d-inline">
    {% csrf_token %}
    <button type="submit" class="btn btn-link p-0 m-0 align-baseline text-decoration-none">
        Se déconnecter
    </button>
</form>
{% else %}
    <p>You are not logged in</p>
    <a href="{% url 'login' %}">Sing Up</a>
{% endif %}
{% endblock %}
